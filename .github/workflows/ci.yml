name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host:
    name: host build + tests (no board needed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libopencv-dev
      - name: Configure + build
        run: ./scripts/build_host.sh
      - name: ctest
        # 金张量依赖的测试在无 assets/gold 时自动 SKIP；真正的逐位回归在本地跑
        run: ctest --test-dir build-host --output-on-failure
